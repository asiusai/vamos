name: build and publish vamOS images

on:
  workflow_dispatch:
    inputs:
      ota_only:
        description: Publish the signed OTA without a factory image
        type: boolean
        default: false
  push:
    branches: [release]

concurrency:
  group: vamos-image-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    environment: vamos-release
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      VAMOS_PUBLIC_URL: ${{ vars.VAMOS_PUBLIC_URL }}
    steps:
      - name: check out release source
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          submodules: recursive

      - name: fetch Git LFS release assets
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          for attempt in $(seq 1 12); do
            if git lfs fetch origin "$GITHUB_SHA"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
          git lfs checkout
          git lfs fsck

      - name: resolve release inputs
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < userspace/root/VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+([.][0-9]+)?$ ]]; then
            echo "invalid userspace/root/VERSION: $version" >&2
            exit 1
          fi
          source_tag="vamos-v${version}"
          if git ls-remote --exit-code origin "refs/tags/$source_tag" >/dev/null 2>&1; then
            # Compare the immutable version tag with this release source.
            git fetch --force origin "refs/tags/$source_tag:refs/tags/$source_tag"
            tagged_commit=$(git rev-list -n 1 "$source_tag")
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "$source_tag points to $tagged_commit, not release source $GITHUB_SHA" >&2
              echo "bump userspace/root/VERSION before publishing a new image" >&2
              exit 1
            fi
          fi
          echo "VAMOS_VERSION=$version" >> "$GITHUB_ENV"

      - name: free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker system prune --all --force

      - name: install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler dosfstools e2fsprogs gdisk grub2-common jq mtools unzip

      - name: install release signature provider
        run: |
          python3 -m venv /tmp/vamos-release-python
          /tmp/vamos-release-python/bin/pip install cryptography==50.0.2
          echo "/tmp/vamos-release-python/bin" >> "$GITHUB_PATH"

      - name: install AWS CLI
        run: |
          set -euo pipefail
          if command -v aws >/dev/null; then
            aws --version
            exit 0
          fi
          case "$(uname -m)" in
            aarch64|arm64) aws_arch=aarch64 ;;
            x86_64) aws_arch=x86_64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          temporary=$(mktemp -d)
          trap 'rm -rf "$temporary"' EXIT
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" \
            -o "$temporary/awscliv2.zip"
          unzip -q "$temporary/awscliv2.zip" -d "$temporary"
          sudo "$temporary/aws/install"
          aws --version

      - name: validate release configuration
        env:
          VAMOS_UPDATE_SIGNING_KEY: ${{ secrets.VAMOS_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET"
          test -n "$VAMOS_PUBLIC_URL"
          test -n "$VAMOS_UPDATE_SIGNING_KEY"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api head-bucket --bucket "$R2_BUCKET" --endpoint-url "$endpoint"

      - name: build kernel, root filesystem, and ESP
        run: |
          ./vamos build kernel
          ./vamos build system
          ./vamos build esp

      - name: build factory disk
        if: ${{ !inputs.ota_only }}
        env:
          VAMOS_SKIP_FLASH_BUNDLE: '1'
        run: |
          ./vamos build disk --storage ufs

      - name: validate release images
        run: |
          set -euo pipefail
          test "$(stat -c %s build/esp.img)" -eq $((256 * 1024 * 1024))
          test -s build/system.img
          test "$(stat -c %s build/system.img)" -le $((10 * 1024 * 1024 * 1024))
          test "$(blkid -p -s TYPE -o value build/system.img)" = erofs
          fsck.vfat -n build/esp.img

      - name: validate factory images
        if: ${{ !inputs.ota_only }}
        run: |
          set -euo pipefail
          test "$(stat -c %s "build/dragon-ufs.img")" -eq 62537072640
          e2fsck -fn "build/userdata-ufs.img"
          if debugfs -R 'stat /openpilot' "build/userdata-ufs.img" 2>&1 | grep -q 'Inode:'; then
            echo 'blank userdata unexpectedly contains openpilot' >&2
            exit 1
          fi

      - name: package content-addressed update
        run: |
          python3 tools/build/package_ota.py \
            --version "$VAMOS_VERSION" \
            --base-url "${VAMOS_PUBLIC_URL%/}/vamos/objects"
          PYTHONPATH=userspace/root/usr/lib python3 -c \
            'from vamos.update import load_manifest; load_manifest("build/ota/vamos.json")'

      - name: package content-addressed browser flash image
        if: ${{ !inputs.ota_only }}
        run: |
          python3 -m unittest discover -s tools/build -p 'test_package_flash.py'
          mkdir -p build/release
          python3 tools/build/package_flash.py \
            --version "$VAMOS_VERSION" \
            --base-url "${VAMOS_PUBLIC_URL%/}/vamos/flash/objects" \
            --image "build/dragon-ufs.img" \
            --layout "build/factory-layout-ufs.json" \
            --userdata "build/userdata-ufs.img" \
            --output-dir "build/flash-ufs"
          cp "build/flash-ufs/flash.json" "build/release/flash-ufs.json"

      - name: sign update manifest
        env:
          VAMOS_UPDATE_SIGNING_KEY: ${{ secrets.VAMOS_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$VAMOS_UPDATE_SIGNING_KEY" > "$key"
          mkdir -p build/release
          cp build/ota/vamos.json build/release/vamos.json
          PYTHONPATH=userspace/root/usr/lib python3 -m vamos.signatures \
            --key "$key" --public userspace/root/usr/share/vamos/update-public.pem build/release/*.json
          cp build/release/vamos.json.sig build/ota/vamos.json.sig

      - name: upload signed manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: vamos-manifest-${{ env.VAMOS_VERSION }}
          path: |
            build/release/*.json
            build/release/*.json.sig
          if-no-files-found: error
          retention-days: 90

      - name: upload immutable R2 images
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for image in build/ota/*.img build/ota/*.img.xz; do
            [ -f "$image" ] || continue
            aws s3 cp "$image" "s3://${R2_BUCKET}/vamos/objects/$(basename "$image")" \
              --endpoint-url "$endpoint" \
              --cache-control "public,max-age=31536000,immutable" \
              --content-type application/octet-stream
          done
          for object in build/flash-ufs/*.img.xz build/flash-ufs/*.bin; do
            aws s3 cp "$object" "s3://${R2_BUCKET}/vamos/flash/objects/$(basename "$object")" \
              --endpoint-url "$endpoint" \
              --cache-control "public,max-age=31536000,immutable" \
              --content-type application/octet-stream
          done

      - name: upload versioned R2 manifest
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for manifest in build/release/*.json build/release/*.json.sig; do
            content_type=application/json
            [[ "$manifest" != *.sig ]] || content_type=application/octet-stream
            aws s3 cp "$manifest" "s3://${R2_BUCKET}/vamos/releases/${VAMOS_VERSION}/$(basename "$manifest")" \
              --endpoint-url "$endpoint" --cache-control "public,max-age=300" --content-type "$content_type"
          done

      - name: publish stable R2 manifest last
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp build/ota/vamos.json.sig "s3://${R2_BUCKET}/vamos/vamos.json.sig" \
            --endpoint-url "$endpoint" \
            --cache-control "no-cache" \
            --content-type application/octet-stream
          aws s3 cp build/ota/vamos.json "s3://${R2_BUCKET}/vamos/vamos.json" \
            --endpoint-url "$endpoint" \
            --cache-control "no-cache" \
            --content-type application/json

      - name: publish stable factory manifest
        if: ${{ !inputs.ota_only }}
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp build/release/flash-ufs.json.sig "s3://${R2_BUCKET}/vamos/flash-ufs.json.sig" \
            --endpoint-url "$endpoint" --cache-control "no-cache" --content-type application/octet-stream
          aws s3 cp build/release/flash-ufs.json "s3://${R2_BUCKET}/vamos/flash-ufs.json" \
            --endpoint-url "$endpoint" --cache-control "no-cache" --content-type application/json

      - name: create source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_ONLY: ${{ inputs.ota_only }}
        run: |
          set -euo pipefail
          source_tag="vamos-v${VAMOS_VERSION}"
          if gh release view "$source_tag" >/dev/null 2>&1; then
            echo "$source_tag release already exists"
          else
            notes="Signed manifests are attached to this release. Device images are published to Cloudflare R2 at ${VAMOS_PUBLIC_URL%/}/vamos/."
            if [ "$OTA_ONLY" = true ]; then
              notes="This release contains a signed OTA update. The factory image will be published separately. $notes"
            fi
            gh release create "$source_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "vamOS ${VAMOS_VERSION}" \
              --notes "$notes"
          fi
          gh release upload "$source_tag" \
            build/release/*.json build/release/*.json.sig \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
