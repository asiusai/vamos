name: build and publish vamOS images

on:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Update the stable vamos.json pointer
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "vamos-v*"

concurrency:
  group: vamos-image-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    environment: vamos-release
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      VAMOS_PUBLIC_URL: ${{ vars.VAMOS_PUBLIC_URL }}
    steps:
      - name: check out release source
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          submodules: recursive

      - name: fetch Git LFS release assets
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          for attempt in $(seq 1 12); do
            if git lfs fetch origin "$GITHUB_SHA"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
          git lfs checkout
          git lfs fsck

      - name: resolve release inputs
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < userspace/root/VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+([.][0-9]+)?$ ]]; then
            echo "invalid userspace/root/VERSION: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "vamos-v${version}" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $version (expected vamos-v${version})" >&2
            exit 1
          fi
          source_tag="vamos-v${version}"
          if git ls-remote --exit-code origin "refs/tags/$source_tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$source_tag:refs/tags/$source_tag"
            tagged_commit=$(git rev-list -n 1 "$source_tag")
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "$source_tag points to $tagged_commit, not release source $GITHUB_SHA" >&2
              echo "bump userspace/root/VERSION before publishing a new image" >&2
              exit 1
            fi
          fi
          openpilot_commit=$(git ls-remote https://github.com/asiusai/openpilot.git refs/heads/master | awk '{print $1}')
          test -n "$openpilot_commit"
          echo "VAMOS_VERSION=$version" >> "$GITHUB_ENV"
          echo "VAMOS_OPENPILOT_REF=$openpilot_commit" >> "$GITHUB_ENV"

      - name: free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker system prune --all --force

      - name: install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools e2fsprogs grub2-common mtools unzip

      - name: install AWS CLI
        run: |
          set -euo pipefail
          if command -v aws >/dev/null; then
            aws --version
            exit 0
          fi
          case "$(uname -m)" in
            aarch64|arm64) aws_arch=aarch64 ;;
            x86_64) aws_arch=x86_64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          temporary=$(mktemp -d)
          trap 'rm -rf "$temporary"' EXIT
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" \
            -o "$temporary/awscliv2.zip"
          unzip -q "$temporary/awscliv2.zip" -d "$temporary"
          sudo "$temporary/aws/install"
          aws --version

      - name: validate release configuration
        env:
          OPENPILOT_DEPLOY_KEY: ${{ secrets.OPENPILOT_DEPLOY_KEY }}
          VAMOS_UPDATE_SIGNING_KEY: ${{ secrets.VAMOS_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET"
          test -n "$VAMOS_PUBLIC_URL"
          test -n "$OPENPILOT_DEPLOY_KEY"
          test -n "$VAMOS_UPDATE_SIGNING_KEY"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api head-bucket --bucket "$R2_BUCKET" --endpoint-url "$endpoint"

      - name: build kernel, root filesystem, ESP, and factory disk
        run: |
          ./vamos build kernel
          VAMOS_SKIP_EROFS=1 ./vamos build system
          ./vamos build esp
          ./vamos build disk

      - name: validate release images
        run: |
          set -euo pipefail
          test "$(stat -c %s build/esp.img)" -eq $((256 * 1024 * 1024))
          test "$(stat -c %s build/system.img)" -eq $((10 * 1024 * 1024 * 1024))
          test "$(stat -c %s build/dragon.img)" -gt $((10 * 1024 * 1024 * 1024))
          test "$(( $(stat -c %s build/dragon.img) % 512 ))" -eq 0
          fsck.vfat -n build/esp.img
          e2fsck -fn build/system.img

      - name: package content-addressed update
        run: |
          python3 tools/build/package_ota.py \
            --version "$VAMOS_VERSION" \
            --base-url "${VAMOS_PUBLIC_URL%/}/vamos/objects"
          PYTHONPATH=userspace/root/usr/lib python3 -c \
            'from vamos.update import load_manifest; load_manifest("build/ota/vamos.json")'

      - name: package content-addressed browser flash image
        run: |
          python3 -m unittest discover -s tools/build -p 'test_package_flash.py'
          python3 tools/build/package_flash.py \
            --version "$VAMOS_VERSION" \
            --base-url "${VAMOS_PUBLIC_URL%/}/vamos/flash/objects"

      - name: sign update manifest
        env:
          VAMOS_UPDATE_SIGNING_KEY: ${{ secrets.VAMOS_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          public=$(mktemp)
          trap 'rm -f "$key" "$public"' EXIT
          printf '%s\n' "$VAMOS_UPDATE_SIGNING_KEY" > "$key"
          openssl pkey -in "$key" -pubout -out "$public"
          cmp "$public" userspace/root/usr/share/vamos/update-public.pem
          openssl pkeyutl -sign -inkey "$key" -rawin \
            -in build/ota/vamos.json -out build/ota/vamos.json.sig
          openssl pkeyutl -sign -inkey "$key" -rawin \
            -in build/flash/flash.json -out build/flash/flash.json.sig
          test "$(stat -c %s build/ota/vamos.json.sig)" -eq 64
          test "$(stat -c %s build/flash/flash.json.sig)" -eq 64
          openssl pkeyutl -verify -pubin -inkey "$public" -rawin \
            -in build/ota/vamos.json -sigfile build/ota/vamos.json.sig
          openssl pkeyutl -verify -pubin -inkey "$public" -rawin \
            -in build/flash/flash.json -sigfile build/flash/flash.json.sig

      - name: upload signed manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: vamos-manifest-${{ env.VAMOS_VERSION }}
          path: |
            build/ota/vamos.json
            build/ota/vamos.json.sig
            build/flash/flash.json
            build/flash/flash.json.sig
          if-no-files-found: error
          retention-days: 90

      - name: configure browser download CORS
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api put-bucket-cors \
            --bucket "$R2_BUCKET" \
            --endpoint-url "$endpoint" \
            --cors-configuration '{"CORSRules":[{"AllowedHeaders":["*"],"AllowedMethods":["GET","HEAD"],"AllowedOrigins":["https://flash.asius.ai","http://localhost:4173","http://localhost:5173"],"ExposeHeaders":["Content-Length","ETag"],"MaxAgeSeconds":3600}]}'

      - name: upload immutable R2 images
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for image in build/ota/*.img.xz; do
            aws s3 cp "$image" "s3://${R2_BUCKET}/vamos/objects/$(basename "$image")" \
              --endpoint-url "$endpoint" \
              --cache-control "public,max-age=31536000,immutable" \
              --content-type application/x-xz
          done
          for object in build/flash/*.img.xz build/flash/*.bin; do
            aws s3 cp "$object" "s3://${R2_BUCKET}/vamos/flash/objects/$(basename "$object")" \
              --endpoint-url "$endpoint" \
              --cache-control "public,max-age=31536000,immutable" \
              --content-type application/octet-stream
          done

      - name: upload versioned R2 manifest
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp build/ota/vamos.json.sig \
            "s3://${R2_BUCKET}/vamos/releases/${VAMOS_VERSION}/vamos.json.sig" \
            --endpoint-url "$endpoint" \
            --cache-control "public,max-age=300" \
            --content-type application/octet-stream
          aws s3 cp build/ota/vamos.json \
            "s3://${R2_BUCKET}/vamos/releases/${VAMOS_VERSION}/vamos.json" \
            --endpoint-url "$endpoint" \
            --cache-control "public,max-age=300" \
            --content-type application/json
          aws s3 cp build/flash/flash.json.sig \
            "s3://${R2_BUCKET}/vamos/releases/${VAMOS_VERSION}/flash.json.sig" \
            --endpoint-url "$endpoint" \
            --cache-control "public,max-age=300" \
            --content-type application/octet-stream
          aws s3 cp build/flash/flash.json \
            "s3://${R2_BUCKET}/vamos/releases/${VAMOS_VERSION}/flash.json" \
            --endpoint-url "$endpoint" \
            --cache-control "public,max-age=300" \
            --content-type application/json

      - name: check out openpilot fork
        uses: actions/checkout@v4
        with:
          repository: asiusai/openpilot
          ssh-key: ${{ secrets.OPENPILOT_DEPLOY_KEY }}
          path: openpilot
          ref: master

      - name: publish manifest to openpilot
        run: |
          set -euo pipefail
          destination=openpilot/openpilot/system/hardware/v1
          cp build/ota/vamos.json "$destination/vamos.json"
          cp build/ota/vamos.json.sig "$destination/vamos.json.sig"
          cd openpilot
          if [ -z "$(git status --porcelain -- openpilot/system/hardware/v1/vamos.json openpilot/system/hardware/v1/vamos.json.sig)" ]; then
            echo "openpilot already contains this manifest"
            exit 0
          fi
          git add openpilot/system/hardware/v1/vamos.json openpilot/system/hardware/v1/vamos.json.sig
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update vamOS manifest to $VAMOS_VERSION"
          git push origin HEAD:master

      - name: publish stable R2 manifest last
        if: startsWith(github.ref, 'refs/tags/vamos-v') || inputs.publish_latest
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp build/ota/vamos.json.sig "s3://${R2_BUCKET}/vamos/vamos.json.sig" \
            --endpoint-url "$endpoint" \
            --cache-control "no-cache" \
            --content-type application/octet-stream
          aws s3 cp build/ota/vamos.json "s3://${R2_BUCKET}/vamos/vamos.json" \
            --endpoint-url "$endpoint" \
            --cache-control "no-cache" \
            --content-type application/json
          aws s3 cp build/flash/flash.json.sig "s3://${R2_BUCKET}/vamos/flash.json.sig" \
            --endpoint-url "$endpoint" \
            --cache-control "no-cache" \
            --content-type application/octet-stream
          aws s3 cp build/flash/flash.json "s3://${R2_BUCKET}/vamos/flash.json" \
            --endpoint-url "$endpoint" \
            --cache-control "no-cache" \
            --content-type application/json

      - name: create source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_tag="vamos-v${VAMOS_VERSION}"
          if gh release view "$source_tag" >/dev/null 2>&1; then
            echo "$source_tag release already exists"
          else
            gh release create "$source_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "vamOS ${VAMOS_VERSION}" \
              --notes "Signed manifests are attached to this release. Device images are published to Cloudflare R2 at ${VAMOS_PUBLIC_URL%/}/vamos/."
          fi
          gh release upload "$source_tag" \
            build/ota/vamos.json \
            build/ota/vamos.json.sig \
            build/flash/flash.json \
            build/flash/flash.json.sig \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
