name: release vamOS to R2

on:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Update the stable vamos.json pointer
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "vamos-v*"

concurrency:
  group: vamos-r2-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    environment: vamos-release
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      VAMOS_PUBLIC_URL: ${{ vars.VAMOS_PUBLIC_URL }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          submodules: recursive

      - name: Fetch Git LFS release assets
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          for attempt in $(seq 1 12); do
            if git lfs fetch origin "$GITHUB_SHA"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
          git lfs checkout
          git lfs fsck

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker system prune --all --force

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools e2fsprogs grub2-common mtools unzip

      - name: Install AWS CLI
        run: |
          set -euo pipefail
          if command -v aws >/dev/null; then
            aws --version
            exit 0
          fi
          case "$(uname -m)" in
            aarch64|arm64) aws_arch=aarch64 ;;
            x86_64) aws_arch=x86_64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" \
            -o "$tmp/awscliv2.zip"
          unzip -q "$tmp/awscliv2.zip" -d "$tmp"
          sudo "$tmp/aws/install"
          aws --version

      - name: Validate release configuration
        run: |
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET"
          test -n "$VAMOS_PUBLIC_URL"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api head-bucket --bucket "$R2_BUCKET" --endpoint-url "$endpoint"

      - name: Build kernel and root filesystem
        run: |
          ./vamos build kernel
          VAMOS_SKIP_EROFS=1 ./vamos build system
          ./vamos build esp

      - name: Validate release images
        run: |
          set -euo pipefail
          test "$(stat -c %s build/esp.img)" -eq $((256 * 1024 * 1024))
          test "$(stat -c %s build/system.img)" -eq $((10 * 1024 * 1024 * 1024))
          fsck.vfat -n build/esp.img
          e2fsck -fn build/system.img

      - name: Package content-addressed update
        run: |
          VERSION=$(cat userspace/root/VERSION)
          echo "VAMOS_VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 tools/build/package_ota.py \
            --version "$VERSION" \
            --base-url "${VAMOS_PUBLIC_URL%/}/vamos/objects"

      - name: Sign update manifest
        env:
          VAMOS_UPDATE_SIGNING_KEY: ${{ secrets.VAMOS_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          public=$(mktemp)
          trap 'rm -f "$key" "$public"' EXIT
          printf '%s\n' "$VAMOS_UPDATE_SIGNING_KEY" > "$key"
          openssl pkey -in "$key" -pubout -out "$public"
          cmp "$public" userspace/root/usr/share/vamos/update-public.pem
          openssl pkeyutl -sign -inkey "$key" -rawin \
            -in build/ota/vamos.json -out build/ota/vamos.json.sig
          test "$(stat -c %s build/ota/vamos.json.sig)" -eq 64
          openssl pkeyutl -verify -pubin -inkey "$public" -rawin \
            -in build/ota/vamos.json -sigfile build/ota/vamos.json.sig

      - name: Upload immutable images
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for image in build/ota/*.img.xz; do
            aws s3 cp "$image" "s3://${R2_BUCKET}/vamos/objects/$(basename "$image")" \
              --endpoint-url "$endpoint" \
              --cache-control "public,max-age=31536000,immutable" \
              --content-type application/x-xz
          done

      - name: Upload versioned manifest
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp build/ota/vamos.json.sig \
            "s3://${R2_BUCKET}/vamos/releases/${VAMOS_VERSION}/vamos.json.sig" \
            --endpoint-url "$endpoint" \
            --cache-control "public,max-age=300" \
            --content-type application/octet-stream
          aws s3 cp build/ota/vamos.json \
            "s3://${R2_BUCKET}/vamos/releases/${VAMOS_VERSION}/vamos.json" \
            --endpoint-url "$endpoint" \
            --cache-control "public,max-age=300" \
            --content-type application/json

      - name: Publish stable manifest last
        if: startsWith(github.ref, 'refs/tags/vamos-v') || inputs.publish_latest
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp build/ota/vamos.json.sig "s3://${R2_BUCKET}/vamos/vamos.json.sig" \
            --endpoint-url "$endpoint" \
            --cache-control "no-cache" \
            --content-type application/octet-stream
          aws s3 cp build/ota/vamos.json "s3://${R2_BUCKET}/vamos/vamos.json" \
            --endpoint-url "$endpoint" \
            --cache-control "no-cache" \
            --content-type application/json
