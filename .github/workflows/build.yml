name: build

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.run_id || github.head_ref || github.ref }}-build-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: run host-side tests
        env:
          PYTHONPATH: .:tools
        run: |
          python3 -m unittest \
            tools.camerad_env_quote_test \
            tools.device_update_test \
            tools.validate_camerad_vfe_test \
            tools.update.test_vamos_update \
            tools.build.test_package_ota

  build-kernel:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: get kernel submodule ref
        id: kernel-submodule
        run: echo "ref=$(git ls-tree HEAD kernel/linux | awk '{print $3}')" | tee -a "$GITHUB_OUTPUT"

      - name: restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-kernel-${{ steps.kernel-submodule.outputs.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-kernel-${{ steps.kernel-submodule.outputs.ref }}-
            ccache-kernel-

      - name: build kernel
        run: ./vamos build kernel

      - name: validate kernel outputs
        run: |
          test -s build/Image
          test -s build/Image.gz
          test -s build/qcs6490-radxa-dragon-q6a.dtb
          file build/Image build/Image.gz build/qcs6490-radxa-dragon-q6a.dtb

      - name: upload kernel outputs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-images
          path: |
            build/Image.gz
            build/qcs6490-radxa-dragon-q6a.dtb
          if-no-files-found: error
          retention-days: 1

      - name: package matching system build inputs
        run: |
          tar -C build -czf build/system-kernel-inputs.tar.gz \
            modules_install kernel-out/include/config/kernel.release

      - name: upload matching system build inputs
        uses: actions/upload-artifact@v4
        with:
          name: system-kernel-inputs
          path: build/system-kernel-inputs.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-system:
    needs: build-kernel
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: system-kernel-inputs
          path: build

      - name: unpack matching kernel modules
        run: tar -C build -xzf build/system-kernel-inputs.tar.gz

      - name: install system image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs grub2-common jq

      - name: build system image
        run: ./vamos build system

      - name: validate system outputs
        run: |
          test -s build/system.img
          test "$(stat -c %s build/system.img)" -le $((10 * 1024 * 1024 * 1024))
          test "$(blkid -p -s TYPE -o value build/system.img)" = erofs

      - name: upload rootfs profile
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-profile
          path: |
            build/rootfs-profile.json
            build/rootfs-profile.md
          if-no-files-found: error
          retention-days: 1
