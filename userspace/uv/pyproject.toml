[project]
name = "vamos"
version = "0.1.0"
authors = [{name = "Vehicle Researcher", email = "user@comma.ai"}]
requires-python = ">=3.12.3, <3.13"
description = ""
dependencies = [
  # Shipping runtime only; development and test tools belong in their jobs.
  # Remove compromised emSign roots from runtime and package-management TLS.
  "certifi==2026.10.19",
  "pip==26.2.2",

  # bled.py
  "dbus-fast==5.0.22",
  # amplifier.py
  "smbus2==0.5.0",

  # Post-quantum sessions, recording access, and release verification
  "cryptography==50.0.2",

  # provisioning
  "pyusb==1.3.1",
  "paramiko==5.1.0",
  # WebRTC device streaming
  "libdatachannel-py==2026.1.0.dev2",

  # On-device camera/encoder health diagnostics
  "av==13.1.0",
  "Pillow==13.0.0",
  # SConstruct imports this even when openpilot's optional tools are disabled.
  "comma-deps-ncurses==6.5.post103",

  # Device workload ABI and build tools. Keep these pinned in VamOS so image
  # builds do not fetch workload source, models, or build metadata.
  "sounddevice==0.5.6",
  "requests==2.34.2",
  "tqdm==4.70.1",
  "scons==4.11.1",
  "pycapnp==2.1.0",
  "numpy==2.5.3",
  "comma-deps-capnproto==1.0.1.post103",
  "comma-deps-acados==0.2.2.post103",
  "Cython==3.3.1",
  "comma-deps-ffmpeg==7.1.0.post103",
  "comma-deps-zstd==1.5.6.post103",
  "comma-deps-json11==20170411.0.post103",
  "comma-deps-gcc-arm-none-eabi==13.2.1.post103",
  "PyJWT[crypto]==2.15.1",
  "websocket-client==1.9.2",
  "inputs==0.5",
  "setproctitle==1.3.7",
  "jeepney==0.9.0",
  "zstandard==0.25.0",
  "comma-deps-raylib==6.0.0.1.post111",
  # Panda USB, vehicle authentication, and native workload builds.
  "libusb1==3.4.0",
  "libusb-package==1.0.30.0",
  "pycryptodome==3.23.0",
  "sympy==1.14.0",
  "comma-deps-eigen==3.4.0.post103",
  "nanobind==3.1.0",
  "setuptools==84.1.0",
]

[tool.uv]
environments = ["python_version >= '3.12' and python_version < '3.13' and sys_platform == 'linux'"]
