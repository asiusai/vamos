[project]
name = "vamos"
version = "0.1.0"
authors = [{name = "Vehicle Researcher", email = "user@comma.ai"}]
requires-python = ">=3.12.3, <3.13"
description = ""
dependencies = [
  # Shipping runtime only; development and test tools belong in their jobs.

  # bled.py
  "dbus-fast==5.0.22",
  # amplifier.py
  "smbus2==0.5.0",

  # provisioning
  "pyusb==1.3.1",
  "paramiko==5.1.0",
  # WebRTC device streaming
  "libdatachannel-py==2026.1.0.dev2",

  # On-device camera/encoder health diagnostics
  "av==13.1.0",
  "Pillow==12.3.0",
  # SConstruct imports this even when openpilot's optional tools are disabled.
  "comma-deps-ncurses==6.5.post103",
]

[tool.uv]
environments = ["python_version >= '3.12' and python_version < '3.13' and sys_platform == 'linux'"]

