[project]
name = "vamos"
version = "0.1.0"
authors = [{name = "Vehicle Researcher", email = "user@comma.ai"}]
requires-python = ">=3.12.3, <3.13"
description = ""
dependencies = [
  "openpilot",
  "openpilot[testing]",
  "onnxruntime-qnn @ https://github.com/ZIFENG278/onnxruntime/releases/download/v1.23.2/onnxruntime_qnn-1.23.2-cp312-cp312-linux_aarch64.whl",

  # bled.py
  "dbus-fast>=5.0.0,<6",
  # amplifier.py
  "smbus2",

  # provisioning
  "pyusb",
  "paramiko",
  # WebRTC device streaming
  "libdatachannel-py>=2026.1.0.dev2",

  # extra nice-to-haves
  "matplotlib",
  "evdev",
  "ipython",
  "py-spy",
  "spidev2",
  "flaky",
]

[tool.uv]
environments = ["python_version >= '3.12' and python_version < '3.13' and sys_platform == 'linux'"]

[tool.uv.sources]
openpilot = { path = "openpilot" }
