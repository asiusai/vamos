# Public authenticated time. Never include unauthenticated NTP pools.
server time.cloudflare.com iburst nts minpoll 4 maxpoll 6
server nts.netnod.se iburst nts minpoll 4 maxpoll 6
authselectmode require
nocerttimecheck 1
maxdistance 2
port 0
cmdport 0
bindcmdaddress /run/chrony/chronyd.sock
driftfile /data/chrony/drift
ntsdumpdir /data/chrony
pidfile /run/chrony/chronyd.pid
