#!/usr/sbin/nft -f

# Replace only this table. Remote SSH policy belongs to set_ssh.sh.
destroy table inet filter

table inet filter {
  chain input {
    type filter hook input priority filter;
    policy accept;

    # Check before established connections too. NCM addresses are not proof of USB ingress.
    ip daddr 192.168.42.2 tcp dport 22 iifname != "usb0" drop
    ct state established,related accept
    iifname "wwan0" drop
  }
}
