# vamOS disk-resident A/B selector. This configuration is embedded in the EFI
# binary so booting never depends on board-local EFI variables or files outside
# the two ESPs.

set timeout=0
set default=0

search --no-floppy --label VAMOS-A --set=esp_a
search --no-floppy --label VAMOS-B --set=esp_b

set chosen_generation=0
set chosen_rank=0
set chosen_active=a
set chosen_pending=
set chosen_phase=stable
set chosen_root_a=PARTLABEL=rootfs_a
set chosen_root_b=PARTLABEL=rootfs_b

function consider_state {
  set state_device="$1"
  if [ -z "$state_device" ]; then
    return
  fi

  set state_file="($state_device)/EFI/vamos/grubenv"
  if [ ! -f "$state_file" ]; then
    return
  fi

  unset generation
  unset active
  unset pending
  unset phase
  unset root_a
  unset root_b
  load_env --file "$state_file" generation active pending phase root_a root_b

  if ! regexp '^[0-9]+$' "$generation"; then
    return
  fi
  if [ "$active" != a -a "$active" != b ]; then
    return
  fi
  if ! regexp '^PART(UUID|LABEL)=[A-Za-z0-9._-]+$' "$root_a"; then
    return
  fi
  if ! regexp '^PART(UUID|LABEL)=[A-Za-z0-9._-]+$' "$root_b"; then
    return
  fi

  if [ "$phase" = stable ]; then
    set candidate_rank=3
  elif [ "$phase" = attempted ]; then
    set candidate_rank=2
  elif [ "$phase" = armed ]; then
    set candidate_rank=1
  else
    return
  fi

  if [ "$phase" != stable ]; then
    if [ "$pending" != a -a "$pending" != b ]; then
      return
    fi
    if [ "$pending" = "$active" ]; then
      return
    fi
  fi

  if [ "$generation" -gt "$chosen_generation" ]; then
    set choose_candidate=1
  elif [ "$generation" = "$chosen_generation" -a "$candidate_rank" -gt "$chosen_rank" ]; then
    # A partially persisted transition is resolved conservatively: stable
    # rollback wins over attempted, which wins over a not-yet-tried update.
    set choose_candidate=1
  else
    set choose_candidate=0
  fi

  if [ "$choose_candidate" = 1 ]; then
    set chosen_generation="$generation"
    set chosen_rank="$candidate_rank"
    set chosen_active="$active"
    set chosen_pending="$pending"
    set chosen_phase="$phase"
    set chosen_root_a="$root_a"
    set chosen_root_b="$root_b"
  fi
}

function persist_state {
  set state_saved=0
  if [ -n "$esp_a" -a -f "($esp_a)/EFI/vamos/grubenv" ]; then
    if save_env --file "($esp_a)/EFI/vamos/grubenv" generation active pending phase root_a root_b; then
      set state_saved=1
    fi
  fi
  if [ -n "$esp_b" -a -f "($esp_b)/EFI/vamos/grubenv" ]; then
    if save_env --file "($esp_b)/EFI/vamos/grubenv" generation active pending phase root_a root_b; then
      set state_saved=1
    fi
  fi
}

function select_esp {
  if [ "$boot_slot" = a ]; then
    set boot_esp="$esp_a"
  else
    set boot_esp="$esp_b"
  fi
}

function boot_selected {
  select_esp
  if [ -z "$boot_esp" ]; then
    return
  fi

  set kernel="($boot_esp)/EFI/vamos/Image"
  if [ ! -f "$kernel" ]; then
    return
  fi

  if [ "$boot_slot" = a ]; then
    set root_argument="$root_a"
  else
    set root_argument="$root_b"
  fi

  echo "vamOS: booting slot $boot_slot$trial_description"
  if chainloader "$kernel" console=ttyMSM0,115200n8 earlycon root=$root_argument rootwait rw fw_devlink=permissive quiet loglevel=3 vamos.slot=$boot_slot $trial_argument; then
    boot
  fi
}

consider_state "$esp_a"
consider_state "$esp_b"

set generation="$chosen_generation"
set active="$chosen_active"
set pending="$chosen_pending"
set phase="$chosen_phase"
set root_a="$chosen_root_a"
set root_b="$chosen_root_b"
set trial_argument=
set trial_description=

if [ "$phase" = armed ]; then
  # Persist the attempt before handing control to Linux. Any reset before
  # userspace commits the trial therefore causes rollback on the next boot.
  set phase=attempted
  persist_state
  if [ "$state_saved" = 1 ]; then
    set boot_slot="$pending"
    set trial_argument=vamos.trial=1
    set trial_description=" (trial)"
  else
    echo "vamOS: could not persist trial state; keeping slot $active"
    set boot_slot="$active"
  fi
elif [ "$phase" = attempted ]; then
  echo "vamOS: rolling back uncommitted slot $pending"
  set pending=
  set phase=stable
  persist_state
  set boot_slot="$active"
else
  set boot_slot="$active"
fi

boot_selected

# A missing or rejected trial kernel rolls back immediately without requiring
# another firmware boot. Stable-slot corruption falls through to the other slot
# and makes that recovery choice persistent.
if [ -n "$trial_argument" ]; then
  echo "vamOS: trial slot $boot_slot did not load; returning to $active"
  set pending=
  set phase=stable
  persist_state
  set boot_slot="$active"
  set trial_argument=
  set trial_description=" (rollback)"
  boot_selected
fi

if [ "$boot_slot" = a ]; then
  set boot_slot=b
else
  set boot_slot=a
fi
echo "vamOS: stable slot failed; trying recovery slot $boot_slot"
set active="$boot_slot"
set pending=
set phase=stable
persist_state
set trial_argument=vamos.recovery=1
set trial_description=" (recovery)"
boot_selected

echo "vamOS: no bootable slot found"
halt
